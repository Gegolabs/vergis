name: renovate

# Renovate SELF-HOSTED — corre en este CI, no como GitHub App.
#
# Por qué self-hosted: instalar la App exige consentimiento OAuth del owner de la org en el
# navegador (acción humana, no automatizable). Esta vía usa exactamente el MISMO `renovate.json`
# de la raíz —cooldown de 14 días, `osvVulnerabilityAlerts`, pinning por digest— sin depender de
# esa instalación. Ver ADR-001 §Mitigaciones operacionales.
#
# El control que esto enciende NO es «estar al día»: es el COOLDOWN de supply chain. Un paquete
# npm comprometido se detecta en horas/días; no adoptar nada con menos de 14 días publicado
# significa que la versión envenenada ya fue despublicada antes de que este repo la tocara.

on:
  schedule:
    # Lunes 06:00 UTC. Semanal basta: el cooldown de 14 días hace irrelevante la latencia de días.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Nivel de log de Renovate'
        required: false
        default: 'info'
        type: choice
        options: [info, debug]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # FAIL-CLOSED, en la misma doctrina que #117: distinguir «no hay nada que actualizar» de
      # «el control no está corriendo». Sin el token, Renovate se saltaría el trabajo en silencio
      # y el workflow quedaría verde — un control inerte con cara de control vigente. Preferimos
      # el rojo honesto: un scheduled run fallando ES la señal de que el cooldown no está activo.
      - name: Verificar que el token existe
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::error::Falta el secret RENOVATE_TOKEN. El cooldown de supply chain del ADR-001 NO está activo."
            echo ""
            echo "Emitir un PAT fine-grained en https://github.com/settings/personal-access-tokens/new"
            echo "  · Resource owner: Gegolabs   (NO tu usuario: el repo es de la org)"
            echo "  · Repository access: Only select repositories -> Gegolabs/vergis"
            echo "  · Permissions (Repository):"
            echo "      Contents ......... Read and write   (empujar las ramas de update)"
            echo "      Pull requests .... Read and write   (abrir los PRs)"
            echo "      Workflows ........ Read and write   (OBLIGATORIO acá: 'helpers:pinGitHubActionDigests'"
            echo "                                          de renovate.json edita .github/workflows/*)"
            echo "      Issues ........... Read and write   (OBLIGATORIO acá: 'config:recommended' abre el"
            echo "                                          Dependency Dashboard, que es un issue)"
            echo "      Metadata ......... Read-only        (se activa solo, es obligatorio)"
            echo ""
            echo "Guardarlo en Settings -> Secrets and variables -> Actions -> New repository secret,"
            echo "con nombre exacto RENOVATE_TOKEN."
            echo ""
            echo "Nota: el PAT expira. El día que expire, este workflow vuelve a fallar acá — que es"
            echo "el comportamiento buscado: el cooldown apagado tiene que verse, no degradarse en silencio."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Versión elegida aplicando el cooldown de 14 días del propio `renovate.json` (2026-08-10):
      # v46.2.2/v46.2.1/v46.2.0 tenían 1/8/13 días publicadas. v46.1.21 (2026-07-27) es la más
      # reciente que cumple. Predicar con el ejemplo: el arnés del cooldown no se salta el cooldown.
      - name: Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        env:
          # El token del PAT: Renovate abre los PRs con esta identidad.
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          # Solo este repo — el PAT no debe alcanzar a nada más.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # `renovate.json` de la raíz ya existe: ni onboarding ni PR de onboarding.
          RENOVATE_ONBOARDING: 'false'
          # Sin config en el repo, ABORTA. No queremos una corrida con defaults silenciosos:
          # los defaults NO traen el cooldown de 14 días, que es la razón de ser de esto.
          RENOVATE_REQUIRE_CONFIG: 'required'
          # Permite el `postUpgradeTasks` de `renovate.json`, que regenera el lockfile después del
          # upgrade. `allowedCommands` (antes `allowedPostUpgradeCommands`) es GLOBAL-ONLY: es del
          # administrador del bot, no del repo — un repo no puede auto-autorizarse a ejecutar
          # comandos. Con la lista vacía (default) el postUpgradeTask NO corre y no dice por qué.
          # Lo podemos hacer por ser self-hosted; como GitHub App esta puerta no existe.
          # El regex ancla en `^`: solo ese comando, no cualquiera que lo contenga.
          RENOVATE_ALLOWED_COMMANDS: '["^npm install --package-lock-only"]'
          # NOTA (2026-08-11): aquí vivió `RENOVATE_BINARY_SOURCE: install`, puesto como
          # hipótesis para el defecto del lockfile (Renovate regenera con 156 refs `@esbuild/`
          # contra las 234 de `main` y `npm ci` aborta). Se MIDIÓ con ramas que sí tocan el
          # lockfile y siguió dando 156 ⇒ REFUTADO, igual que `constraints.npm`. Se retira para
          # no dejar una variable sin justificación. El defecto sigue abierto — ver PENDINGS.md.
          # Reporte de resultado, para el gate fail-closed del step siguiente. La accion monta
          # /tmp:/tmp en el contenedor, asi que el runner puede leer lo que Renovate escribe aca.
          # `reportType` es EXPERIMENTAL y su shape no esta documentado: por eso el step de abajo
          # hoy MIDE y no bloquea. Se vuelve gate cuando el shape este medido — ver PENDINGS.md.
          RENOVATE_REPORT_TYPE: file
          RENOVATE_REPORT_PATH: /tmp/renovate-report.json
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}

      # MIDIENDO, TODAVIA NO BLOQUEA. El objetivo es cerrar el hueco que se destapo el 2026-08-12:
      # Renovate puede ABORTAR a mitad —`repository-changed`, p. ej. por un 403 al publicar commit
      # status— procesando UNA sola rama de ~19, y el job sale VERDE igual. Eso contradice la
      # doctrina fail-closed que este workflow declara arriba: un control corriendo a un quinceavo
      # de su alcance con cara de vigente es exactamente lo que queremos que se vea.
      #
      # No se convierte en gate antes de medir el shape del reporte: colgar un `exit 1` de un
      # formato experimental supuesto produce falsos rojos permanentes, que erosionan la senal que
      # el gate existe para dar.
      - name: Resultado de la corrida (fail-closed en construccion)
        if: always()
        run: |
          R=/tmp/renovate-report.json
          if [ ! -f "$R" ]; then
            echo "::warning::No se genero $R. NO se pudo medir el resultado de la corrida"
            echo "  (distinto de «la corrida estuvo bien»: es «no pude medir»)."
            exit 0
          fi
          echo "Tamano: $(wc -c < "$R") bytes"
          echo "--- claves de primer nivel ---"
          jq -r 'if type=="object" then keys[] else type end' "$R" 2>/dev/null || echo "(no es JSON parseable por jq)"
          echo "--- reporte completo (recortado a 4000 chars) ---"
          head -c 4000 "$R"; echo
          echo "--- deteccion de abort ---"
          if grep -q 'repository-changed' "$R"; then
            echo "::warning::La corrida ABORTO con repository-changed — procesa solo parte de las ramas."
          else
            echo "Sin repository-changed en el reporte."
          fi
