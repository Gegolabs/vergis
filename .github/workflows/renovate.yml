name: renovate

# Renovate SELF-HOSTED — corre en este CI, no como GitHub App.
#
# Por qué self-hosted: instalar la App exige consentimiento OAuth del owner de la org en el
# navegador (acción humana, no automatizable). Esta vía usa exactamente el MISMO `renovate.json`
# de la raíz —cooldown de 14 días, `osvVulnerabilityAlerts`, pinning por digest— sin depender de
# esa instalación. Ver ADR-001 §Mitigaciones operacionales.
#
# El control que esto enciende NO es «estar al día»: es el COOLDOWN de supply chain. Un paquete
# npm comprometido se detecta en horas/días; no adoptar nada con menos de 14 días publicado
# significa que la versión envenenada ya fue despublicada antes de que este repo la tocara.

on:
  schedule:
    # Lunes 06:00 UTC. Semanal basta: el cooldown de 14 días hace irrelevante la latencia de días.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Nivel de log de Renovate'
        required: false
        default: 'info'
        type: choice
        options: [info, debug]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # FAIL-CLOSED, en la misma doctrina que #117: distinguir «no hay nada que actualizar» de
      # «el control no está corriendo». Sin el token, Renovate se saltaría el trabajo en silencio
      # y el workflow quedaría verde — un control inerte con cara de control vigente. Preferimos
      # el rojo honesto: un scheduled run fallando ES la señal de que el cooldown no está activo.
      - name: Verificar que el token existe
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::error::Falta el secret RENOVATE_TOKEN. El cooldown de supply chain del ADR-001 NO está activo."
            echo "Crear un PAT (fine-grained) sobre este repo con permisos: Contents=RW, Pull requests=RW, Metadata=R;"
            echo "guardarlo como secret RENOVATE_TOKEN en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v7

      # Versión elegida aplicando el cooldown de 14 días del propio `renovate.json` (2026-08-10):
      # v46.2.2/v46.2.1/v46.2.0 tenían 1/8/13 días publicadas. v46.1.21 (2026-07-27) es la más
      # reciente que cumple. Predicar con el ejemplo: el arnés del cooldown no se salta el cooldown.
      - name: Renovate
        uses: renovatebot/github-action@v46.1.21
        env:
          # El token del PAT: Renovate abre los PRs con esta identidad.
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          # Solo este repo — el PAT no debe alcanzar a nada más.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # `renovate.json` de la raíz ya existe: ni onboarding ni PR de onboarding.
          RENOVATE_ONBOARDING: 'false'
          # Sin config en el repo, ABORTA. No queremos una corrida con defaults silenciosos:
          # los defaults NO traen el cooldown de 14 días, que es la razón de ser de esto.
          RENOVATE_REQUIRE_CONFIG: 'required'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
