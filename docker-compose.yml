# Vergis Free (AGPL-3.0) — despliegue single-node, cloud-agnóstico.
# Corre en CUALQUIER VM con Docker (AWS/GCP/OCI/Azure/laptop). Sin PaaS.
#
# Uso:
#   cp .env.example .env   # y completa VERGIS_CONNECTIONS (+ user/pass opcional)
#   docker compose up -d   # → Vergis sirviendo en http://localhost:8080
#
# Sirve los reportes de VERGIS_SPECS, ruteados por código (/qw-04, /qw-04p, ...).
# Imagen: build local (docker compose build) o, cuando exista el repo público, ghcr.io/...
services:
  vergis:
    build: .
    image: vergis:local
    ports:
      # Bind a loopback: detrás de Caddy+oauth2-proxy, publicar en 0.0.0.0 dejaría el 8080
      # alcanzable saltándose el SSO (y Docker puentea ufw/firewalld con sus reglas iptables).
      # Caddy accede por loopback o por la red interna de compose.
      - "127.0.0.1:8080:8080"
    environment:
      # Reportes a servir (rutas dentro de la imagen), separados por coma.
      VERGIS_SPECS: /app/examples/asistencia-completa-hijuelas.yaml,/app/examples/proyeccion-semanal-hijuelas.yaml
      VERGIS_REFRESH_MS: "300000"
      # Perfil(es) de conexión SQL (JSON con el Service Principal). Desde .env — nunca en git.
      VERGIS_CONNECTIONS: ${VERGIS_CONNECTIONS}
      # Gate básico opcional (vacío = sin gate; en prod, usar oauth2-proxy / SSO).
      VERGIS_USER: ${VERGIS_USER:-}
      VERGIS_PASS: ${VERGIS_PASS:-}
    restart: unless-stopped
    init: true
    mem_limit: 1g
    # `/healthz` responde 503 hasta bootstrap: healthcheck reacciona a un proceso colgado o eterno-503,
    # no solo a crashes. node:22-slim no trae curl → se usa el fetch de Node.
    #
    # JUZGA POR LA FASE, NUNCA POR `r.ok` NI POR EL CÓDIGO HTTP. Desde 0.20.0 un nodo EN ESPERA
    # (standby) responde 200 con `ok:true` POR DISEÑO: está sano, sirve lecturas y NO tiene el plano de
    # control — sus mutaciones contestan 409. Un chequeo que mirara `r.ok` lo declararía `healthy` sin
    # que estuviera sirviendo escrituras. El predicado es el canónico, el mismo del borde
    # (`deploy/Caddyfile.reference`) y del conmutador (`deploy/rollout/vergis-rollout`, `serving_ok`):
    #
    #   sano  ⇔  HTTP 200  ∧  "phase":"serving"  ∧  (sin bloque `pis`  ∨  pis.serving == pis.total)
    #
    # El bloque `pis` se exige SOLO SI VIENE: `/healthz` lo omite cuando el motor no tiene servibilidad
    # por PI (`VERGIS_ENGINE` distinto de `fabric`), y exigirlo incondicionalmente dejaría a este compose
    # —el modo Free mínimo, que es justo el que más lo sufriría— en `unhealthy` perpetuo. El cuerpo se
    # PARSEA, no se grepea: un grep de `"serving"` colisiona con `"phase":"serving"`. Y todo lo que no se
    # puede medir —cuerpo vacío, cuerpo no-JSON, conexión rechazada— cuenta como FALLO: «no pude medir»
    # nunca es verde.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(async r=>{const b=JSON.parse(await r.text());process.exit(r.status===200&&b.phase==='serving'&&(!b.pis||b.pis.total===b.pis.serving)?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Rotación: el driver json-file por defecto crece sin tope y llena el disco de una VM chica.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
