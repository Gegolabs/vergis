# Vergis Free (AGPL-3.0) — despliegue single-node, cloud-agnóstico.
# Corre en CUALQUIER VM con Docker (AWS/GCP/OCI/Azure/laptop). Sin PaaS.
#
# Uso:
#   cp .env.example .env   # y completa VERGIS_CONNECTIONS (+ user/pass opcional)
#   docker compose up -d   # → Vergis sirviendo en http://localhost:8080
#
# Sirve los reportes de VERGIS_SPECS, ruteados por código (/qw-04, /qw-04p, ...).
# Imagen: build local (docker compose build) o, cuando exista el repo público, ghcr.io/...
services:
  vergis:
    build: .
    image: vergis:local
    ports:
      # Bind a loopback: detrás de Caddy+oauth2-proxy, publicar en 0.0.0.0 dejaría el 8080
      # alcanzable saltándose el SSO (y Docker puentea ufw/firewalld con sus reglas iptables).
      # Caddy accede por loopback o por la red interna de compose.
      - "127.0.0.1:8080:8080"
    environment:
      # Reportes a servir (rutas dentro de la imagen), separados por coma.
      VERGIS_SPECS: /app/examples/asistencia-completa-hijuelas.yaml,/app/examples/proyeccion-semanal-hijuelas.yaml
      VERGIS_REFRESH_MS: "300000"
      # Perfil(es) de conexión SQL (JSON con el Service Principal). Desde .env — nunca en git.
      VERGIS_CONNECTIONS: ${VERGIS_CONNECTIONS}
      # Gate básico opcional (vacío = sin gate; en prod, usar oauth2-proxy / SSO).
      VERGIS_USER: ${VERGIS_USER:-}
      VERGIS_PASS: ${VERGIS_PASS:-}
    restart: unless-stopped
