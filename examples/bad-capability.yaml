# Spec deliberadamente inválida: referencia una Capability no catalogada.
# Sirve al criterio de aceptación 4 (rechazo con error estructurado).
mira_version: "1.0"

identity:
  id: spec-invalida
  display_name: "Spec inválida (capability no catalogada)"
  classification: public

piece:
  layout: rows
  elements:
    - kpi:
        metric: data.estado.agentes_vivos
        label: "Agentes vivos"
        format: int_0

data:
  estado:
    capability: execute-sql-dwh-foo
    params:
      rows:
        - { agentes_vivos: 1 }
    shape:
      type: single_row
      fields: { agentes_vivos: integer }

quality:
  freshness: { max_age: PT0S, source_watermark: ignore }
  refresh: { mode: on-demand }
  degradation: { on_capability_fail: agentic_fallback }

delivery:
  render:
    - { format: html, target: web }
  channels:
    - type: file
      capability: publicar-artefacto
      params: { path: invalida.html }
      schedule: on_refresh
