# NEGATIVO: PI sin declaración de audiencia → rechazado (fail-closed por omisión, charter §2a).
# La omisión NO es público: hay que declarar 'rls: [...]' o 'rls: public' a propósito.
mira_version: "1.0"

identity:
  id: bad-no-audience
  display_name: "Sin audiencia"
  classification: public

piece:
  layout: rows
  elements:
    - kpi: { metric: data.estado.n, label: "N", format: int_0 }

data:
  estado:
    capability: static-data
    params:
      rows:
        - { n: 1 }
    shape:
      type: single_row
      fields: { n: integer }

quality:
  freshness: { max_age: PT0S, source_watermark: ignore }
  refresh: { mode: on-demand }
  degradation: { on_capability_fail: agentic_fallback }
  # (sin audience → debe rechazarse)

delivery:
  render:
    - { format: html, target: web }
  channels:
    - type: file
      capability: publicar-artefacto
      params: { path: bad-no-audience.html }
      schedule: on_refresh
