mira_version: "1.0"

identity:
  id: hello-vergis
  display_name: "Hola, Vergis"
  classification: public

piece:
  layout: rows
  elements:
    - markdown_block:
        content: "# Hola, Vergis — {{ data.estado.fecha }}"
    - kpi:
        metric: data.estado.agentes_vivos
        label: "Agentes vivos"
        format: int_0

data:
  estado:
    capability: static-data
    params:
      rows:
        - { agentes_vivos: 1, fecha: "2026-05-28" }
    shape:
      type: single_row
      fields: { agentes_vivos: integer, fecha: string }

quality:
  freshness: { max_age: PT0S, source_watermark: ignore }
  refresh: { mode: on-demand }
  degradation: { on_capability_fail: agentic_fallback }

delivery:
  render:
    - { format: html, target: web }
  channels:
    - type: file
      capability: publicar-artefacto
      params: { path: hello.html }
      schedule: on_refresh
