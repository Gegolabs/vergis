# Vergis — DESPLIEGUE DE REFERENCIA con Administración/gobierno (motor Fabric, push-down).
#
# Este archivo es el CONTRATO Producto→Infra: la lista canónica de envs + montajes que el motor
# necesita para encender la app de Administración (avatar Perfil/Gestión/Configuración), la gestión
# de dominio/ingesta, la data maestra, el registro de fuentes/frescura y el gobierno de PI.
#
# NO se despliega tal cual: es una PLANTILLA genérica, sin secretos ni datos de ninguna instancia.
# Una instancia lo COPIA a su repo de infraestructura, reemplaza los `<...>` y pone los secretos en
# archivos gitignored (env_file). El `docker-compose.yml` de la raíz es el modo "Free" MÍNIMO (sin
# gobierno) — no partir de él para un despliegue con Administración.
#
# El propio motor verifica este contrato al arrancar (server/deployment-check.ts): si un env aquí
# referencia un archivo/carpeta que no montaste, o pides gobierno con VERGIS_OUT efímero, el arranque
# lo GRITA (y en modo estricto aborta) en vez de degradar en silencio. Ajusta el rigor con
# VERGIS_CONFIG_CHECK = strict (default) | warn | off.
#
# ═══ ANILLOS: DESPLEGAR SIN VENTANA DE MANTENIMIENTO (issue #210) ═════════════════════════════════
#
# Este archivo trae el borde que CONMUTA. Caddy expone un segundo listener interno (`:8079`) que apunta
# al ANILLO ACTIVO mediante `rings/active.caddy` —un archivo de una línea— y retiene los requests en una
# sala de espera cuando ningún nodo declara `"phase":"serving"`. Promover = escribir esa línea y
# recargar Caddy en caliente: **oauth2-proxy no se toca en el acto**, y por eso el corte percibido es
# cero. Ver `Caddyfile.reference` (el predicado de salud está ahí y es lo importante) y
# `rollout/README.md` (la herramienta de ciclo de vida: install / promote / rollback / retire / prune /
# status).
#
# Dos modos, ambos válidos con este mismo archivo:
#
#   · UN SOLO NODO (lo de siempre): el servicio `vergis` de abajo sirve, `rings/active.caddy` apunta a
#     él (es su valor de fábrica) y desplegar sigue siendo un recreate —con su corte y su ventana—.
#   · ANILLOS: los nodos NO los declara este compose. Los crea `botler-rollout` como contenedores
#     `vergis-<versión>` (`vergis-0-19-0`) desde `ghcr.io/gegolabs/vergis:<versión>`, con los MISMOS
#     envs y montajes que el servicio de abajo — copiados una vez a `rollout/ring.args`. En este modo
#     el servicio `vergis` se comenta (o se deja como último nodo pre-anillos hasta la primera
#     promoción) y el borde deja de depender de él.
#
# ⚠ `rollout/ring.args` es la MISMA lista de envs y montajes del servicio `vergis`: si acá cambia un
# env o un volumen, ahí también. Nada lo verifica por ti — es el precio de que los anillos vivan fuera
# del ciclo de vida de compose (que es justamente lo que permite no recrearlos).
#
# ⚠⚠ LÍMITE DE CONTRATO — UN SOLO HOST, CON FS LOCAL (issue #210 · I10). Los anillos coordinan quién
# escribe mediante un lease sobre `${VERGIS_OUT}/control.lease.json`, y ese lease se ordena por **rename
# atómico** y por relojes del **mismo kernel**. Por eso el montaje de `VERGIS_OUT` (acá `./governance`)
# tiene que ser un **volumen LOCAL del host donde corren los anillos**.
#
#   FUERA DE CONTRATO: un volumen de RED (NFS, SMB/CIFS, EFS, Azure Files…) o anillos repartidos en dos
#   hosts. No está soportado ni medido, y el modo de falla que habilita —dos nodos creyéndose el activo
#   sobre el mismo archivo— es exactamente el que este mecanismo existe para hacer imposible.
#
# Si tu `./governance` vive en un share de red, **este mecanismo no aplica a tu instalación**: sigue con
# un solo nodo (`rings/active.caddy` apuntando al servicio `vergis` de abajo, su valor de fábrica) y con
# la ventana de mantenimiento de siempre. La ceremonia de promoción y este límite están en
# `rollout/RUNBOOK.md`.
services:
  vergis:
    # SIN digest a propósito: esta referencia es NUESTRA imagen y este archivo es la plantilla que
    # una instancia copia — lo que un lector quiere copiar es el tag móvil. Pinearla (PR #174) creó
    # churn perpetuo: cada build de `main` publica un digest nuevo y Renovate abría PR para bumpearlo.
    # El cooldown de supply chain NO se debilita: aplica a las imágenes de TERCEROS (ver caddy abajo),
    # que son las que este repo no controla. `renovate.json` tiene la regla que impide re-pinearla.
    #
    # `latest` acá significa «la última versión PUBLICADA» (el tag lo mueve un tag de git, no un merge
    # a `main` — ver la tabla de tags del CHANGELOG). Aun así, en PRODUCCIÓN conviene pinnear la
    # versión exacta (`:0.16.0`) o la serie (`:0.16`): con un tag móvil, la próxima release entra en
    # el siguiente `pull`/recreate sin que nadie lo decida. La elección es de quien opera la
    # instancia; esta plantilla trae el tag móvil porque es lo que un lector quiere copiar.
    image: ghcr.io/gegolabs/vergis:latest
    restart: unless-stopped
    # Secretos de la instancia (NUNCA en git): VERGIS_CONNECTIONS (Service Principal → Fabric),
    # VERGIS_ADMIN_SEED (admins semilla), VERGIS_INDEX_TITLE/LOGO (branding). En un archivo gitignored.
    # VERGIS_CONNECTIONS acepta JSON inline O una RUTA a un archivo JSON montado (preferido): un
    # archivo con permisos restrictivos no queda legible en /proc ni `docker inspect`, y tiene
    # hot-reload — dar de alta el warehouse de un dominio nuevo no exige restart (junto con
    # VERGIS_DOMAINS y VERGIS_INTAKE, que también recargan en caliente).
    #
    # CREDENCIAL POR PERFIL (issue #66): cada perfil de VERGIS_CONNECTIONS declara cómo obtiene su
    # token con el campo opcional `auth`. La config existente NO requiere migración: `auth` ausente
    # equivale a `secret`, el modo de siempre. Los tres modos y sus campos obligatorios:
    #
    #   "auth": "secret"     (DEFAULT si se omite)  → tenantId + clientId + clientSecret
    #   "auth": "federated"  (workload identity)    → tenantId + clientId + federatedTokenFile
    #                                                 (o la env AZURE_FEDERATED_TOKEN_FILE); el archivo
    #                                                 se re-lee en cada adquisición porque rota
    #   "auth": "imds"       (managed identity VM)  → nada obligatorio; clientId solo para user-assigned MI
    #
    # Ejemplo: {"dwh": {"server": "...", "database": "...", "auth": "imds"}}
    # Fail-closed: un perfil cuya credencial no resuelve ABORTA el arranque nombrando el database_ref
    # y el campo faltante; en hot-reload el error se loguea y la config vigente sigue viva. No hay
    # fallback silencioso entre modos. Activar `imds`/`federated` exige verificar antes que Fabric
    # acepte ese principal (ver runbook de despliegue).
    env_file: [vergis.env]
    environment:
      VERGIS_ENGINE: fabric                       # motor C: push-down a Fabric (la RLS vive en la fuente)
      VERGIS_SPECS_DIR: /specs                    # PIs servibles (authz-blind) — montaje ./specs
      VERGIS_POLICIES: /policies/entidades.yaml   # policy store data-anchored (coma-separado si son varios)
      VERGIS_IDENTITY_MAP: /identity/map.json     # email del gate → claim de identidad (trust-base)
      # HOST: 127.0.0.1                           # interfaz de escucha (opcional). SIN definir (default):
                                                  #   todas las interfaces — lo que el contenedor necesita
                                                  #   para que el proxy lo alcance. Definirlo solo fuera del
                                                  #   contenedor (arnés de dev localhost-only).
      # VERGIS_GATE_SECRET: <token-compartido>    # D2 · defensa en profundidad (A10): exige `x-gate-token`
                                                  #   en CADA request. El proxy (abajo) debe inyectarlo. Sin
                                                  #   esto el gate confía en X-Forwarded-* a ciegas — seguro
                                                  #   SOLO si vergis:8080 jamás se publica al host (ver abajo).

      # --- Gobierno / Administración (todo esto junto enciende el avatar) ---------------------------
      VERGIS_OUT: /governance                     # ⚠ GovernanceStore PERSISTENTE (admins/dueños/auditoría).
                                                  #   NO /tmp: efímero = se pierde en cada restart.
      VERGIS_MASTER_DATA: /master-data/entidades.yaml   # entidades de data maestra (autoría)
      VERGIS_DOMAINS: /domains.yaml               # dominios (etiqueta + stewards)
      VERGIS_GROUPS: /groups.yaml                 # grupos (p. ej. un "Centro de Excelencia")
      VERGIS_INTAKE: /intake/slots.yaml           # slots de ingesta de archivos
      VERGIS_SOURCES: /sources.yaml               # registro de fuentes (frescura: oferta + engine_ref)
      VERGIS_PI_OWNERS: /pi-owners.yaml           # dueños iniciales por PI (semilla de gobierno)
      VERGIS_INTAKE_SP: <ref-de-conexion>         # conexión cuyo SP escribe OneLake (si hay varias)
      VERGIS_DEFAULT_STEWARD_GROUPS: <grupo>      # steward por default de todos los dominios (opcional)
      VERGIS_DEFAULT_COLLABORATOR_GROUPS: <grupo> # colaborador por default de todos los PIs (opcional)
      VERGIS_SIGNOUT_RD: <url-logout-idp>         # logout completo del IdP (opcional; vacío = interno)
      # VERGIS_PI_ACL: "1"                        # activa la ACL de artefacto de PIs (default off)
      # VERGIS_CONFIG_CHECK: strict               # strict (default) | warn | off

      # --- «Descargar PDF» server-side (issue #65) --------------------------------------------------
      VERGIS_PDF_SERVICE_URL: http://vergis-pdf:9090  # sidecar HTML→PDF (servicio de abajo, red interna).
                                                  #   FAIL-CLOSED: quitar el servicio + esta env apaga la
                                                  #   feature ENTERA — ni botón en la bandeja ni endpoint
                                                  #   /<slug>/pdf (la URL vuelve al 404 de siempre). Es UN
                                                  #   solo interruptor: un botón muerto es imposible.
      # VERGIS_PDF_TIMEOUT_MS: "30000"            # espera máxima de la conversión (default 30 s). Agotada,
                                                  #   el endpoint responde 503 con mensaje claro.
    volumes:
      # A cada env de arriba que referencia un path le corresponde un montaje. Si falta uno, el motor
      # lo detecta al arrancar y falla ruidoso (ese fue el modo de falla del incidente del avatar).
      - ./specs:/specs:ro
      - ./policies:/policies:ro
      - ./identity:/identity:ro
      - ./master-data:/master-data:ro
      - ./governance:/governance            # PERSISTENTE (no :ro): aquí vive governance.sqlite
      - ./domains.yaml:/domains.yaml:ro
      - ./groups.yaml:/groups.yaml:ro
      - ./intake:/intake:ro
      - ./sources.yaml:/sources.yaml:ro
      - ./pi-owners.yaml:/pi-owners.yaml:ro
    # `expose` (NO `ports:`) es DELIBERADO — supuesto de red D2. vergis:8080 debe quedar SOLO en la red
    # interna de compose, alcanzable únicamente por oauth2-proxy. El gate confía en X-Forwarded-* sin
    # verificar (así entrega el proxy la identidad); publicar este puerto al host = cualquiera inyecta
    # X-Forwarded-Groups/-Email arbitrarios = bypass total de RLS. NUNCA le pongas `ports: ["8080:8080"]`.
    # Belt-and-suspenders: define VERGIS_GATE_SECRET (arriba) y que el proxy inyecte `x-gate-token`.
    #
    # Supuesto D1 (solo motor ClickHouse, no este ejemplo Fabric): el servicio ClickHouse debe estar en la
    # MISMA red interna, sin puerto publicado. El usuario data-plane es `no_password` y los claims son
    # settings auto-asignables → alcance de red al HTTP de CH = bypass total de la row-policy. Igual que
    # acá: nada de data-plane se publica; el único ingress público es Caddy (TLS) → oauth2-proxy (SSO).
    expose: ["8080"]
    # DIAGNÓSTICO, NO RUTEO — y la distinción es lo importante de este bloque. Esto solo hace que
    # `docker ps` diga la verdad sobre ESTE servicio. **Quien rutea es el conmutador del borde**, con su
    # propio health check activo en `Caddyfile.reference` — cambiar esto no cambia a dónde va el tráfico.
    #
    # Aplica al modo UN SOLO NODO. En modo ANILLOS los nodos los crea `botler-rollout` con
    # `rollout/ring.args`, que —a diferencia de los envs y los montajes— **no lleva healthcheck**: la
    # salud de un anillo la mide el borde, que es el único que puede actuar sobre ella. Así que este
    # bloque no viaja, y no hace falta que viaje.
    #
    # Juzga por la FASE, jamás por `r.ok` ni por el código HTTP: un nodo EN ESPERA (standby) responde 200
    # con `ok:true` por diseño —sirve lecturas, no tiene el plano de control, sus mutaciones dan 409—, y
    # marcarlo `healthy` sería la mentira más cara que este archivo podría contar en un incidente. El
    # predicado es el canónico, idéntico al del borde y al de `rollout/botler-rollout` (`serving_ok`):
    #
    #   sano  ⇔  HTTP 200  ∧  "phase":"serving"  ∧  (sin bloque `lets`  ∨  lets.serving == lets.total)
    #
    # `lets` se exige SOLO SI VIENE (`/healthz` lo omite cuando el motor no tiene servibilidad por Let; acá
    # el motor es `fabric`, así que viene). El cuerpo se PARSEA, no se grepea: un grep de `"serving"`
    # colisiona con `"phase":"serving"`. Lo no medible —vacío, no-JSON, conexión rechazada— es FALLO.
    # node:22-slim no trae curl → el fetch de Node, el patrón de todo el repo.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(async r=>{const b=JSON.parse(await r.text());process.exit(r.status===200&&b.phase==='serving'&&(!b.lets||b.lets.total===b.lets.serving)?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # El arranque medido de un nodo va de 3,8 a 11,6 s; 40 s cubre una máquina cargada y el tramo en
      # que un nodo reiniciado espera que el lease del proceso anterior venza (10 s por default).
      start_period: 40s

  # Sidecar HTML→PDF (issue #65). Convierte el render en modo print de un PI —que ya nació filtrado por
  # la RLS de quien lo pidió— en un PDF. Es MUDO respecto a identidad: convierte lo que le llega; su
  # seguridad es que SOLO vergis lo alcanza (red interna) y que su url_fetcher bloquea todo lo que no sea
  # un data: URI (nada de SSRF ni de file://). Sin estado: un POST, un PDF, adiós.
  #
  # El directorio `pdf-sidecar/` se VENDOREA desde `deploy/pdf-sidecar/` del repo del producto (Dockerfile
  # + app.py, autocontenidos). Cuando exista imagen publicada, reemplazar `build:` por `image:`.
  vergis-pdf:
    build: ./pdf-sidecar
    restart: unless-stopped
    # `expose` y JAMÁS `ports:` — mismo supuesto de red D2 que vergis: el sidecar vive solo en la red
    # interna del compose. Publicarlo al host daría a cualquiera un conversor HTML→PDF gratuito.
    expose: ["9090"]
    # environment:
    #   PDF_MAX_HTML_BYTES: "20971520"          # tope del HTML aceptado (default 20 MiB)

  # SSO delante del motor: reenvía el email del usuario autenticado como X-Forwarded-Email. Genérico
  # (aquí oauth2-proxy con un IdP OIDC); reemplaza issuer/client por los de tu tenant. Secretos en env_file.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
    restart: unless-stopped
    # SIN `depends_on`: su upstream ya no es un servicio de este compose sino el CONMUTADOR del borde, y
    # los anillos son contenedores que crea `botler-rollout` fuera del ciclo de vida de compose. Un
    # `depends_on: [caddy]` además cerraría un ciclo (caddy depende de este servicio).
    env_file: [oauth2.env]                  # OAUTH2_PROXY_CLIENT_SECRET + COOKIE_SECRET
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: <https://tu-idp/issuer>
      OAUTH2_PROXY_CLIENT_ID: <client-id>
      # CONMUTADOR, no el motor (issue #210 · I7): el upstream es el listener interno de Caddy, que
      # rutea al anillo activo y retiene en la sala de espera cuando no hay ninguno. Este valor es lo
      # ÚNICO que cambia respecto a un despliegue de un solo nodo, y **no se toca en una promoción** —
      # tocarlo exigiría reiniciar el SSO, que es precisamente el corte que los anillos eliminan.
      OAUTH2_PROXY_UPSTREAMS: http://caddy:8079
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"  # reenvía X-Forwarded-Email al motor
      OAUTH2_PROXY_COOKIE_SECURE: "true"
    expose: ["4180"]

  # Terminación TLS / reverse-proxy público Y CONMUTADOR DE ANILLOS (issue #210 · I7). Los dos roles
  # viven en el mismo contenedor a propósito: es el único componente que sobrevive al acto de desplegar
  # (medido), así que es el único que puede cubrir la ausencia del motor. Ver `Caddyfile.reference`.
  #
  # ⚠ El nombre del contenedor importa: la herramienta de anillos lo alcanza por `docker exec` para
  # validar y recargar la config (`RINGS_EDGE`, default `caddy`). Si tu compose le pone otro nombre
  # (prefijo del proyecto), pásalo por env a la herramienta.
  caddy:
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    restart: unless-stopped
    depends_on: [oauth2-proxy]
    # `:8079` NO se publica — `expose`, jamás `ports:`. Mismo supuesto de red D2 que protege a
    # vergis:8080: el conmutador no autentica, hereda la identidad que oauth2-proxy ya inyectó.
    # Publicarlo al host sería un bypass completo del SSO y de la RLS.
    ports: ["80:80", "443:443"]
    expose: ["8079"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # El anillo activo: `rings/active.caddy` (una línea) + `rings/rings.json` (el registro). Montado
      # `:ro` porque el borde solo LEE — quien escribe es `botler-rollout` en el host, y después recarga
      # Caddy en caliente. Copiar `deploy/rings/active.caddy.example` como `rings/active.caddy`.
      - ./rings:/etc/caddy/rings:ro
      # La sala de espera: HTML estático, sin red ni dependencias. Copiar `deploy/edge/espera.html`.
      - ./edge:/etc/caddy/edge:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # El borde SÍ juzga por HTTP: es un proxy, no un nodo con fases. Lo que jamás juzga por HTTP es la
      # salud de un ANILLO — ese predicado exige `"phase":"serving"` y vive en el Caddyfile.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
