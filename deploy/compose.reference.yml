# Vergis — DESPLIEGUE DE REFERENCIA con Administración/gobierno (motor Fabric, push-down).
#
# Este archivo es el CONTRATO Producto→Infra: la lista canónica de envs + montajes que el motor
# necesita para encender la app de Administración (avatar Perfil/Gestión/Configuración), la gestión
# de dominio/ingesta, la data maestra, el registro de fuentes/frescura y el gobierno de PI.
#
# NO se despliega tal cual: es una PLANTILLA genérica, sin secretos ni datos de ninguna instancia.
# Una instancia lo COPIA a su repo de infraestructura, reemplaza los `<...>` y pone los secretos en
# archivos gitignored (env_file). El `docker-compose.yml` de la raíz es el modo "Free" MÍNIMO (sin
# gobierno) — no partir de él para un despliegue con Administración.
#
# El propio motor verifica este contrato al arrancar (server/deployment-check.ts): si un env aquí
# referencia un archivo/carpeta que no montaste, o pides gobierno con VERGIS_OUT efímero, el arranque
# lo GRITA (y en modo estricto aborta) en vez de degradar en silencio. Ajusta el rigor con
# VERGIS_CONFIG_CHECK = strict (default) | warn | off.
services:
  vergis:
    image: ghcr.io/gegolabs/vergis:latest@sha256:e23bd3cd93f4d9e335d8acf5bd932b30bb02bdfa4289f5853e72ffe4b44a894d
    restart: unless-stopped
    # Secretos de la instancia (NUNCA en git): VERGIS_CONNECTIONS (Service Principal → Fabric),
    # VERGIS_ADMIN_SEED (admins semilla), VERGIS_INDEX_TITLE/LOGO (branding). En un archivo gitignored.
    # VERGIS_CONNECTIONS acepta JSON inline O una RUTA a un archivo JSON montado (preferido): un
    # archivo con permisos restrictivos no queda legible en /proc ni `docker inspect`, y tiene
    # hot-reload — dar de alta el warehouse de un dominio nuevo no exige restart (junto con
    # VERGIS_DOMAINS y VERGIS_INTAKE, que también recargan en caliente).
    #
    # CREDENCIAL POR PERFIL (issue #66): cada perfil de VERGIS_CONNECTIONS declara cómo obtiene su
    # token con el campo opcional `auth`. La config existente NO requiere migración: `auth` ausente
    # equivale a `secret`, el modo de siempre. Los tres modos y sus campos obligatorios:
    #
    #   "auth": "secret"     (DEFAULT si se omite)  → tenantId + clientId + clientSecret
    #   "auth": "federated"  (workload identity)    → tenantId + clientId + federatedTokenFile
    #                                                 (o la env AZURE_FEDERATED_TOKEN_FILE); el archivo
    #                                                 se re-lee en cada adquisición porque rota
    #   "auth": "imds"       (managed identity VM)  → nada obligatorio; clientId solo para user-assigned MI
    #
    # Ejemplo: {"dwh": {"server": "...", "database": "...", "auth": "imds"}}
    # Fail-closed: un perfil cuya credencial no resuelve ABORTA el arranque nombrando el database_ref
    # y el campo faltante; en hot-reload el error se loguea y la config vigente sigue viva. No hay
    # fallback silencioso entre modos. Activar `imds`/`federated` exige verificar antes que Fabric
    # acepte ese principal (ver runbook de despliegue).
    env_file: [vergis.env]
    environment:
      VERGIS_ENGINE: fabric                       # motor C: push-down a Fabric (la RLS vive en la fuente)
      VERGIS_SPECS_DIR: /specs                    # PIs servibles (authz-blind) — montaje ./specs
      VERGIS_POLICIES: /policies/entidades.yaml   # policy store data-anchored (coma-separado si son varios)
      VERGIS_IDENTITY_MAP: /identity/map.json     # email del gate → claim de identidad (trust-base)
      # HOST: 127.0.0.1                           # interfaz de escucha (opcional). SIN definir (default):
                                                  #   todas las interfaces — lo que el contenedor necesita
                                                  #   para que el proxy lo alcance. Definirlo solo fuera del
                                                  #   contenedor (arnés de dev localhost-only).
      # VERGIS_GATE_SECRET: <token-compartido>    # D2 · defensa en profundidad (A10): exige `x-gate-token`
                                                  #   en CADA request. El proxy (abajo) debe inyectarlo. Sin
                                                  #   esto el gate confía en X-Forwarded-* a ciegas — seguro
                                                  #   SOLO si vergis:8080 jamás se publica al host (ver abajo).

      # --- Gobierno / Administración (todo esto junto enciende el avatar) ---------------------------
      VERGIS_OUT: /governance                     # ⚠ GovernanceStore PERSISTENTE (admins/dueños/auditoría).
                                                  #   NO /tmp: efímero = se pierde en cada restart.
      VERGIS_MASTER_DATA: /master-data/entidades.yaml   # entidades de data maestra (autoría)
      VERGIS_DOMAINS: /domains.yaml               # dominios (etiqueta + stewards)
      VERGIS_GROUPS: /groups.yaml                 # grupos (p. ej. un "Centro de Excelencia")
      VERGIS_INTAKE: /intake/slots.yaml           # slots de ingesta de archivos
      VERGIS_SOURCES: /sources.yaml               # registro de fuentes (frescura: oferta + engine_ref)
      VERGIS_PI_OWNERS: /pi-owners.yaml           # dueños iniciales por PI (semilla de gobierno)
      VERGIS_INTAKE_SP: <ref-de-conexion>         # conexión cuyo SP escribe OneLake (si hay varias)
      VERGIS_DEFAULT_STEWARD_GROUPS: <grupo>      # steward por default de todos los dominios (opcional)
      VERGIS_DEFAULT_COLLABORATOR_GROUPS: <grupo> # colaborador por default de todos los PIs (opcional)
      VERGIS_SIGNOUT_RD: <url-logout-idp>         # logout completo del IdP (opcional; vacío = interno)
      # VERGIS_PI_ACL: "1"                        # activa la ACL de artefacto de PIs (default off)
      # VERGIS_CONFIG_CHECK: strict               # strict (default) | warn | off

      # --- «Descargar PDF» server-side (issue #65) --------------------------------------------------
      VERGIS_PDF_SERVICE_URL: http://vergis-pdf:9090  # sidecar HTML→PDF (servicio de abajo, red interna).
                                                  #   FAIL-CLOSED: quitar el servicio + esta env apaga la
                                                  #   feature ENTERA — ni botón en la bandeja ni endpoint
                                                  #   /<slug>/pdf (la URL vuelve al 404 de siempre). Es UN
                                                  #   solo interruptor: un botón muerto es imposible.
      # VERGIS_PDF_TIMEOUT_MS: "30000"            # espera máxima de la conversión (default 30 s). Agotada,
                                                  #   el endpoint responde 503 con mensaje claro.
    volumes:
      # A cada env de arriba que referencia un path le corresponde un montaje. Si falta uno, el motor
      # lo detecta al arrancar y falla ruidoso (ese fue el modo de falla del incidente del avatar).
      - ./specs:/specs:ro
      - ./policies:/policies:ro
      - ./identity:/identity:ro
      - ./master-data:/master-data:ro
      - ./governance:/governance            # PERSISTENTE (no :ro): aquí vive governance.sqlite
      - ./domains.yaml:/domains.yaml:ro
      - ./groups.yaml:/groups.yaml:ro
      - ./intake:/intake:ro
      - ./sources.yaml:/sources.yaml:ro
      - ./pi-owners.yaml:/pi-owners.yaml:ro
    # `expose` (NO `ports:`) es DELIBERADO — supuesto de red D2. vergis:8080 debe quedar SOLO en la red
    # interna de compose, alcanzable únicamente por oauth2-proxy. El gate confía en X-Forwarded-* sin
    # verificar (así entrega el proxy la identidad); publicar este puerto al host = cualquiera inyecta
    # X-Forwarded-Groups/-Email arbitrarios = bypass total de RLS. NUNCA le pongas `ports: ["8080:8080"]`.
    # Belt-and-suspenders: define VERGIS_GATE_SECRET (arriba) y que el proxy inyecte `x-gate-token`.
    #
    # Supuesto D1 (solo motor ClickHouse, no este ejemplo Fabric): el servicio ClickHouse debe estar en la
    # MISMA red interna, sin puerto publicado. El usuario data-plane es `no_password` y los claims son
    # settings auto-asignables → alcance de red al HTTP de CH = bypass total de la row-policy. Igual que
    # acá: nada de data-plane se publica; el único ingress público es Caddy (TLS) → oauth2-proxy (SSO).
    expose: ["8080"]

  # Sidecar HTML→PDF (issue #65). Convierte el render en modo print de un PI —que ya nació filtrado por
  # la RLS de quien lo pidió— en un PDF. Es MUDO respecto a identidad: convierte lo que le llega; su
  # seguridad es que SOLO vergis lo alcanza (red interna) y que su url_fetcher bloquea todo lo que no sea
  # un data: URI (nada de SSRF ni de file://). Sin estado: un POST, un PDF, adiós.
  #
  # El directorio `pdf-sidecar/` se VENDOREA desde `deploy/pdf-sidecar/` del repo del producto (Dockerfile
  # + app.py, autocontenidos). Cuando exista imagen publicada, reemplazar `build:` por `image:`.
  vergis-pdf:
    build: ./pdf-sidecar
    restart: unless-stopped
    # `expose` y JAMÁS `ports:` — mismo supuesto de red D2 que vergis: el sidecar vive solo en la red
    # interna del compose. Publicarlo al host daría a cualquiera un conversor HTML→PDF gratuito.
    expose: ["9090"]
    # environment:
    #   PDF_MAX_HTML_BYTES: "20971520"          # tope del HTML aceptado (default 20 MiB)

  # SSO delante del motor: reenvía el email del usuario autenticado como X-Forwarded-Email. Genérico
  # (aquí oauth2-proxy con un IdP OIDC); reemplaza issuer/client por los de tu tenant. Secretos en env_file.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
    restart: unless-stopped
    depends_on: [vergis]
    env_file: [oauth2.env]                  # OAUTH2_PROXY_CLIENT_SECRET + COOKIE_SECRET
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: <https://tu-idp/issuer>
      OAUTH2_PROXY_CLIENT_ID: <client-id>
      OAUTH2_PROXY_UPSTREAMS: http://vergis:8080
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"  # reenvía X-Forwarded-Email al motor
      OAUTH2_PROXY_COOKIE_SECURE: "true"
    expose: ["4180"]

  # Terminación TLS / reverse-proxy público. Genérico (Caddy); cualquier proxy con TLS sirve.
  caddy:
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    restart: unless-stopped
    depends_on: [oauth2-proxy]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
